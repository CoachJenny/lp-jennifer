<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Tes réflexes sous pression · Jennifer Perrault</title>
  <meta name="description" content="Mini-évaluation : comment tu tiens — vraiment — quand la pression monte ? 12 situations · 3 minutes · résultat personnalisé.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%236B3FA0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page">

    <!-- ===== ÉCRAN 0 : ACCUEIL ===== -->
    <section id="screen-welcome" class="screen">
      <div class="logo"></div>
      <p class="intro-eyebrow"></p>
      <h1 class="intro-title"></h1>
      <p class="intro-sub"></p>
      <ul class="intro-promises">
        <li>12 situations — 3 minutes</li>
        <li>Découvre ton profil émotionnel sous pression</li>
        <li>Résultat personnalisé immédiat</li>
      </ul>
      <button type="button" class="btn-submit">Commencer →</button>
    </section>

    <!-- ===== ÉCRANS 1-12 : QUESTIONS (un seul gabarit, recyclé) ===== -->
    <section id="screen-question" class="screen">
      <div class="logo"></div>

      <div class="progress-sticky">
        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </div>
      </div>

      <div class="question-block">
        <p class="question-num"></p>
        <div class="options-wrap"></div>
      </div>

      <div class="nav-row">
        <button type="button" class="btn-back">← Précédent</button>
      </div>
    </section>

    <!-- ===== ÉCRAN 13 : EMAIL GATE ===== -->
    <section id="screen-gate" class="screen">
      <div class="logo"></div>

      <h2 class="gate-title">Ton profil est prêt.</h2>
      <p class="gate-sub">Dis-moi où te l'envoyer — tu recevras aussi des clés pour aller plus loin.</p>

      <form class="gate-form" autocomplete="on" novalidate>
        <div class="field">
          <input type="text" id="field-firstname" name="firstname" placeholder="Ton prénom" autocomplete="given-name" required>
        </div>
        <div class="field">
          <input type="email" id="field-email" name="email" placeholder="ton@email.com" autocomplete="email" required>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="field-rgpd" name="rgpd" required>
          <span class="checkbox-box" aria-hidden="true"></span>
          <span class="checkbox-label">J'accepte de recevoir mes résultats et des contenus de Jennifer Perrault. Désabonnement en un clic.</span>
        </label>

        <button type="submit" id="gate-submit" class="btn-submit" disabled>Découvrir mon profil →</button>
      </form>
    </section>

    <!-- ===== ÉCRAN 14 : RÉSULTAT (rempli dynamiquement) ===== -->
    <section id="screen-result" class="screen"></section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="results.js"></script>
  <script src="quiz.js"></script>
  <script src="email.js"></script>
  <script src="pdf.js"></script>
</body>
</html>
